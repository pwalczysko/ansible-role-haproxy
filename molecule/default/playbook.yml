---
- name: Converge
  hosts: all
  pre_tasks:


    - name : Fix permissions for rhel image
      ansible.builtin.shell:
        cmd: |
          echo ""
          ls -l /etc/shadow
          chmod 0400 /etc/shadow
          ls -l /etc/shadow
          echo ""
      changed_when: false

    - name : zeroc ice | check rocky.repo file
      stat:
        path: /etc/yum.repos.d/rocky.repo
      register: rockyrepo_name

    - name: zeroc ice | install config-manager in rocky
      become: true
      ansible.builtin.dnf:
        update_cache: true
        name:
          - 'dnf-command(config-manager)'
        state: present
      when: rockyrepo_name.stat.exists

    - name: zeroc ice | Enable crp repo in rocky
      become: true
      ansible.builtin.replace:
        path:  /etc/yum.repos.d/rocky.repo
        # create: false
        regexp: enabled=0
        replace: enabled=1
        # state: present
      when: rockyrepo_name.stat.exists

    # - name: zeroc ice | Add  repository for RHEL
    #   become: true
    #   ansible.builtin.command:
    #     subscription-manager repos --enable codeready-builder-for-rhel-9-x86_64-rpms
    #   when: ansible_os_family == 'RedHat' and not rockyrepo_name.stat.exists
    #   ignore_errors: true

    - name: Import a key for epel
      become: true
      ansible.builtin.rpm_key:
        state: present
        key:  https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-9

    - name: epel | setup dnf repository
      become: true
      ansible.builtin.dnf:
        update_cache: true
        name:
          https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
        state: present

    - name: download rsyslog repo
      become: true
      ansible.builtin.get_url: url=http://rpms.adiscon.com/v8-stable/rsyslog.repo dest=/etc/yum.repos.d/

    # - name: enable rsyslog repo
    #   become: true
    #   ansible.builtin.command: "{{ item }}"
    #   with_items:
    #     - cd /etc/yum.repos.d/
    #     - wget http://rpms.adiscon.com/v8-stable/rsyslog.repo
    #   when: rockyrepo_name.stat.exists 


    - name: Install dependencies
      become: true
      ansible.builtin.dnf:
        update_cache: true
        name:
          - python3-policycoreutils
          - python3-libselinux
          - curl
          - rsyslog
          - rsyslog-gnutls
          - rsyslog-gssapi
          - rsyslog-logrotate
          - rsyslog-relp
          - openssl
        allowerasing: true
        state: present

    - name: start rsyslog
      become: true
      service:
        name: rsyslog
        state: started
      # when: haproxy_syslog_enable
      ignore_errors: yes
  
    - name: Check the /var/log/messages
      become: true
      ansible.builtin.command: >-
       cat /var/log/messages
      register: rsys_message
      ignore_errors: yes
      changed_when: false

    - name: Show the message
      debug: 
        msg: "{{ rsys_message }}"

    - name: Debug - what from rsyslog is installed
      become: true
      ansible.builtin.command:
        dnf list installed | grep rsyslog
      register: rsyslog_packages
      ignore_errors: yes
      changed_when: false

    - name: Show output
      debug: 
        msg: "{{ rsyslog_packages }}"

    - name: Ensure dummy certificate is in place
      ansible.builtin.command: >-
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/ssl/certs/dummy.pem -out /etc/ssl/certs/dummy.pem
        -subj "/CN=localhost"
      args:
        creates: /etc/ssl/certs/dummy.pem
      become: true

    # - name: Debug output of systemclt rsyslog
    #   become: true
    #   ansible.builtin.command:
    #     rsyslogd -dn
    #   register: rsyslog_status
    #   ignore_errors: yes

    # - name: Show output
    #   debug: 
    #     msg: "{{ rsyslog_status.stdout }}"

  roles:
    - role: ome.haproxy
      haproxy_syslog_enable: true
      haproxy_syslog_configure_udp: true
      haproxy_frontends:
        - name: hafrontend-http
          address: '*:80'
          extra_addresses:
            - '*:8080'
          # params:
          #   - 'some extra frontend param, acl for example'
          backend: habackend
        - name: hafrontend-tcp
          address: '*:81'
          mode: tcp
          backend: habackend
        - name: hafrontend-https
          address: '*:443'
          bind_params: 'ssl crt /etc/ssl/certs/dummy.pem'
          mode: http
          backend: habackend
      haproxy_backends:
        - name: habackend
          mode: http
          params:
            - 'default-server inter 3s'
          servers:
            - name: app1
              address: 192.168.0.1:80
              extra_opts: 'inter 2s'
            - name: app2
              address: 192.168.0.2:80
